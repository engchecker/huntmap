# Builds the Android app (Capacitor) and publishes a test APK as a GitHub release.
name: Android build

on:
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', '*.webmanifest', 'icons/**', 'vendor/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install and sync web app
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Name the APK
        run: |
          VER=$(node -p "require('./app/package.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/android/app/build/outputs/apk/debug/app-debug.apk HuntAccessNZ-$VER-build${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HuntAccessNZ-apk
          path: HuntAccessNZ-*.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.VER }}-build${{ github.run_number }}
          name: Android test build ${{ env.VER }} (${{ github.run_number }})
          prerelease: true
          files: HuntAccessNZ-*.apk
          body: |
            Test build of the Hunt Access NZ Android app, for installing directly on your phone.
            Download the .apk below on your Android phone and open it. Android will ask you to allow installs from your browser or Files app.
            This is a debug build for testing; the Play Store version will be built and signed separately.
