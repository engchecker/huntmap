<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f2a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fish Access NZ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="fish.css">
</head>
<body class="fish">
<div id="map" aria-label="Map"></div>

<header id="topbar">
  <div class="title"><b>Fish Access NZ</b><small>Mana · Kāpiti · Wellington</small></div>
  <span id="netChip" class="chip" title="Connection status">Online</span>
</header>

<div id="statusBar" hidden><span class="dot"></span><span id="statusText">Locating…</span></div>

<nav id="fabs" aria-label="Map tools">
  <button id="btnMark" class="fab mk" title="Mark this spot" aria-label="Mark my position">
    <svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5" fill="none"/></svg>
  </button>
  <button id="btnLocate" class="fab" title="My location" aria-label="My location">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>
  </button>
  <button id="btnLayers" class="fab" title="Map & layers" aria-label="Map and layers">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5" fill="none"/></svg>
  </button>
  <button id="btnPlan" class="fab" title="Where should I fish?" aria-label="Where should I fish?">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
  </button>
  <button id="btnTide" class="fab" title="Tides" aria-label="Tides">
    <svg viewBox="0 0 24 24"><path d="M2 9c3-3 5-3 8 0s5 3 8 0 3-1 4 0M2 15c3-3 5-3 8 0s5 3 8 0 3-1 4 0" fill="none"/></svg>
  </button>
  <button id="btnMenu" class="fab" title="More" aria-label="More tools">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
</nav>
<div id="crosshair" hidden></div>

<section id="sheet" class="sheet" aria-live="polite" hidden>
  <div class="grab"></div>
  <button class="close" id="sheetClose" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</section>

<div id="toast" role="status" hidden></div>
<div id="dlg" class="dlg" hidden><div class="dlg-card"><p id="dlgText"></p><div class="row"><button id="dlgNo" class="btn ghost">Cancel</button><button id="dlgYes" class="btn">OK</button></div></div></div>

<script src="../config.js"></script>
<script src="../vendor/maplibre-gl.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
