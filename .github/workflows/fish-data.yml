# Fetches the fishing map's open data (boundaries, depth contours, slipways, tides) into fish/data.
# Runs when the fetch script changes, or on demand from the Actions tab.
name: Fishing map data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fish/tools/fetch_data.py', '.github/workflows/fish-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python fish/tools/fetch_data.py
        env:
          LINZ_LDS_KEY: ${{ secrets.LINZ_LDS_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fish/data
          git diff --cached --quiet || (git commit -m "Fishing map data refresh" && git push)
